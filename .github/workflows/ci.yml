name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

  analyze:
    name: Format & Analyze
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --no-pub --coverage

      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '[\d.]+(?=%)')
          echo "Line coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 70" | bc -l)" -eq 1 ]; then
            echo "ERROR: Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi
          echo "Coverage threshold met."

  deno-test:
    name: Edge Function Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run Deno tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Custom rules live at repo root .gitleaks.toml (extends defaults;
        # allowlists only triaged false positives — see that file).

      - name: High-risk secret patterns
        run: |
          set -uo pipefail
          EXIT=0

          echo "==> Tracked .env files (excluding .env.example)"
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[a-z0-9_-]+$' | grep -v '\.env\.example'; then
            echo "::error::Tracked .env file detected"
            EXIT=1
          fi

          echo "==> Tracked keystore artifacts"
          if git ls-files | grep -iE '\.(jks|keystore)$|(^|/)release-keystore$'; then
            echo "::error::Keystore file tracked in git"
            EXIT=1
          fi

          echo "==> Private keys & base64 keystore blobs in source"
          if rg -n --type-add 'src:*.{dart,ts,js,json,yaml,yml,env,toml,sh}' --type src \
              -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              -e 'MII[A-Za-z0-9+/]{60,}={0,2}'; then
            echo "::error::Private key or base64 keystore blob detected in source"
            EXIT=1
          fi

          echo "==> JWT-like tokens in source"
          # config/env*.json hold only the Supabase ANON key (public by
          # design: ships in the client bundle; access is RLS-gated).
          # Service-role/Paymob secrets are checked separately below.
          if rg -n --type-add 'src:*.{dart,ts,js,json,yaml,yml,env,toml,sh}' --type src \
              --glob '!config/env*.json' \
              -e 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'; then
            echo "::error::JWT-like token detected in source"
            EXIT=1
          fi

          echo "==> PAYMOB_ and SUPABASE_SERVICE_ROLE_KEY secrets"
          if rg -n --type-add 'src:*.{dart,ts,js,json,yaml,yml,env,toml,sh}' --type src \
              --glob '!.env.example' \
              -e 'PAYMOB_API_KEY\s*[:=]\s*["'\'']?[A-Za-z0-9]{16,}' \
              -e 'PAYMOB_HMAC_SECRET\s*[:=]\s*["'\'']?[A-Fa-f0-9]{16,}' \
              -e 'SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*["'\'']?(eyJ[A-Za-z0-9_-]{10,}|[A-Za-z0-9._-]{40,})'; then
            echo "::error::PAYMOB or Supabase service-role secret detected"
            EXIT=1
          fi

          if [ "$EXIT" -ne 0 ]; then
            echo "::error::High-risk secrets detected — failing CI"
            exit 1
          fi
          echo "No high-risk secrets detected."

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [analyze, test, deno-test, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Verify no deprecated functions
        run: |
          # Ensure removed functions do not exist
          for fn in paymob-order paymob-auth paymob-payment-key vodafone-cash-payment vodafone-cash-verify; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "ERROR: Deprecated function $fn still exists!"
              exit 1
            fi
          done
          echo "All deprecated functions removed."

      - name: Verify active functions exist
        run: |
          for fn in checkout paymob-initiate paymob-callback cancel-expired-orders send-order-notification; do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "ERROR: Active function $fn is missing!"
              exit 1
            fi
          done
          echo "All active functions present."

      - name: Verify migration sequence
        run: |
          ls -1 supabase/migrations/*.sql | head -20
          echo "Migration files present."

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: [analyze, test, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify signing secrets present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -uo pipefail
          missing=()
          [ -z "$KEYSTORE_BASE64" ]   && missing+=("KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ]         && missing+=("KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ]      && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required signing secrets missing: ${missing[*]}"
            echo "Configure these as GitHub repository secrets before releasing."
            exit 1
          fi
          echo "All signing secrets present."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify package identity
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at $APK_PATH"
            exit 1
          fi

          # Check package name is not com.example.*
          PACKAGE=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep "package: name=" | sed "s/.*name='\([^']*\)'.*/\1/")
          echo "APK package: $PACKAGE"

          if [[ "$PACKAGE" == com.example.* ]]; then
            echo "ERROR: Release APK uses placeholder package: $PACKAGE"
            exit 1
          fi

          echo "Package identity verified: $PACKAGE"

      - name: Verify APK is not debug-signed
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          # Check signing info — debug-signed APKs have specific characteristics
          if aapt dump badging "$APK_PATH" 2>/dev/null | grep -q "debuggable=true"; then
            echo "WARNING: APK may be debug-signed (debuggable flag set)"
          else
            echo "APK signing verification passed"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
