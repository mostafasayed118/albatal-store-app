name: al_batal_elite
description: Premium fabric commerce foundation for Al Batal Elite.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  bloc: ^9.1.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^18.0.1
  intl: ^0.20.2
  # Admin sales dashboard revenue chart (#12, owner-approved). Pinned to
  # 0.71.0 — the newest release whose min Dart SDK (3.2) stays compatible
  # with this project's declared Dart >=3.3 floor; fl_chart 1.x needs Dart
  # >=3.6 and would silently raise the project's SDK floor.
  fl_chart: ^0.71.0
  sentry_flutter: ^9.28.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.0.0 # encrypted at-rest PII + Supabase session (residual-P1, owner-approved)
  cached_network_image: ^4.0.0
  supabase_flutter: ^2.8.4
  url_launcher: ^6.2.5
  uuid: ^4.5.1 # product-image storage key generation (StorageService)
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2 # InstaPay transfer-proof attachment (D3, PR #36 plan; owner-approved)
  connectivity_plus: ^7.3.1 # interface-type signal for the offline gate (B1, owner-approved)
  internet_connection_checker_plus: ^3.1.2 # real reachability probe, v3 pure-Dart API (B2, owner-approved)
  # feature-batch §1 (owner-approved 2026-09-12): re-engagement, UX, media,
  # auth and document capabilities, shipped as interface-wrapped services.
  flutter_local_notifications: ^22.3.0 # §12 local order-status notifications
  onesignal_flutter: ^5.6.10 # §12 push scaffold (env-gated, no-op w/o key)
  share_plus: ^13.3.0 # §5 product share, §14 CSV export, §16 invoice share
  app_links: ^7.2.1 # §5 inbound deep links -> GoRouter
  permission_handler: ^13.0.2 # §12 notification permission gating
  flutter_image_compress: ^2.5.1 # §4 upload compression (fail-open)
  skeletonizer: ^3.0.0 # §3 skeleton loading states
  local_auth: ^3.0.2 # §15 biometric app lock
  pdf: ^3.13.0 # §16 branded invoice PDF
  printing: ^5.15.0 # §16 invoice save/share
  package_info_plus: ^10.2.1 # §13 forced-update min-version check
  photo_view: ^0.15.0 # §7 fullscreen pinch-zoom gallery (task #7, owner-approved re-add)
  # intl 0.20.3 requires a newer flutter_localizations pin; revisit after next Flutter stable.

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1 # deterministic Timer tests (paymob realtime fallback)

  http: ^1.2.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/onboarding/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
